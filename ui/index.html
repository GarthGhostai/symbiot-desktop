<!doctype html>
<html>
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symbiot</title>
<style>
  :root{
    --ink:#0E1A1F; --ink2:#15262C; --ink3:#1D333A; --line:#24404A;
    --bone:#F4F1EA; --text:#B7C9C4; --faint:#7E9690;
    --green:#3DDC97; --green-dim:#16322D; --amber:#F2A541;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column}
  header{padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
  .brand{font-weight:700;color:var(--bone);font-size:16px}
  .status{margin-left:auto;font-size:12px;color:var(--faint);text-align:right;max-width:60%}
  .tabs{display:flex;gap:6px;padding:0 14px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 14px;border:0;background:none;color:var(--faint);font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--bone);border-bottom-color:var(--green)}
  main{flex:1;overflow:auto;padding:16px 18px}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  button.act{background:var(--green);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
  button.act:hover{filter:brightness(1.08)}
  button.ghost{background:var(--ink3);color:var(--bone);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost:hover{border-color:var(--faint)}
  .out{white-space:pre-wrap;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:180px;color:var(--bone);line-height:1.6}
  .muted{color:var(--faint)}
  .chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--green-dim);border:1px solid #2a6b52;color:var(--green)}
  label{display:block;font-size:12px;color:var(--faint);margin:14px 0 5px}
  select,input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--bone);font:inherit}
  select:focus,input:focus{outline:none;border-color:var(--green)}
  a{color:var(--green);cursor:pointer}
  .hidden{display:none}
  .note{font-size:12px;margin-top:10px}
  .ok{color:var(--green)} .err{color:var(--amber)}
</style>
</head>
<body>
  <header>
    <span class="dot"></span><span class="brand">Symbiot</span>
    <span class="status" id="status">…</span>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="week">Week</button>
    <button class="tab" data-tab="standup">Standup</button>
    <button class="tab" data-tab="todo">Todo</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>
  <main>
    <!-- run panels -->
    <section id="panel-run">
      <div class="row">
        <button class="act" id="write">Write my <span id="what">week</span></button>
        <button class="ghost hidden" id="copy">Copy</button>
        <span class="muted" id="hint">Reads your local git and writes it up.</span>
      </div>
      <div class="out muted" id="out">Nothing yet — hit the button.</div>
    </section>

    <!-- settings panel -->
    <section id="panel-settings" class="hidden">
      <label>Which AI should Symbiot write with?</label>
      <select id="provider">
        <option value="anthropic">Claude (Anthropic)</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="gemini">Gemini (Google)</option>
        <option value="ollama">Local model (Ollama)</option>
      </select>

      <div id="keyWrap">
        <label>API key</label>
        <input id="key" type="password" placeholder="paste your key">
        <div class="note"><a id="getkey">Where do I get a key? →</a></div>
      </div>
      <div id="baseWrap" class="hidden">
        <label>Ollama URL</label>
        <input id="baseUrl" type="text" value="http://localhost:11434">
      </div>

      <label>Model <span class="muted" id="modelHint"></span></label>
      <input id="model" type="text" placeholder="(leave blank for the default)">

      <div class="row" style="margin-top:16px">
        <button class="act" id="save">Save & connect</button>
        <span class="note" id="saveMsg"></span>
      </div>
    </section>
  </main>

<script>
  const KEYURL = {
    anthropic: "https://console.anthropic.com/settings/keys",
    openai: "https://platform.openai.com/api-keys",
    gemini: "https://aistudio.google.com/apikey",
    ollama: "https://ollama.com",
  };
  const DEFMODEL = { anthropic:"claude-opus-5-5", openai:"gpt-4o-mini", gemini:"gemini-1.5-flash", ollama:"llama3.1" };
  const $ = (id) => document.getElementById(id);
  let current = "week";

  async function setTab(tab){
    current = tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===tab));
    const isSettings = tab === "settings";
    $("panel-run").classList.toggle("hidden", isSettings);
    $("panel-settings").classList.toggle("hidden", !isSettings);
    if(!isSettings){
      $("what").textContent = tab;
      $("copy").classList.add("hidden");
      // if a run for this tab already happened (e.g. from the tray), show it
      const last = await window.symbiot.last();
      if(last && last.cmd === tab && last.text){ $("out").textContent = last.text; $("out").classList.remove("muted"); $("copy").classList.remove("hidden"); }
      else { $("out").textContent = "Nothing yet — hit the button."; $("out").classList.add("muted"); }
    }
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));

  async function refreshStatus(){
    const s = await window.symbiot.status();
    $("status").textContent = s.connected ? s.line : "Not connected — open Settings";
  }

  $("write").addEventListener("click", async () => {
    $("out").textContent = "Writing…"; $("out").classList.add("muted"); $("copy").classList.add("hidden");
    const r = await window.symbiot.run(current);
    $("out").textContent = r.text || "(no output)";
    $("out").classList.remove("muted");
    $("copy").classList.remove("hidden");
  });
  $("copy").addEventListener("click", () => { navigator.clipboard.writeText($("out").textContent); $("copy").textContent="Copied"; setTimeout(()=>$("copy").textContent="Copy",1400); });

  // settings
  function syncProvider(){
    const p = $("provider").value;
    const local = p === "ollama";
    $("keyWrap").classList.toggle("hidden", local);
    $("baseWrap").classList.toggle("hidden", !local);
    $("getkey").textContent = local ? "About Ollama →" : "Where do I get a key? →";
    $("modelHint").textContent = "· default " + DEFMODEL[p];
    $("model").placeholder = "(blank = " + DEFMODEL[p] + ")";
  }
  $("provider").addEventListener("change", syncProvider);
  $("getkey").addEventListener("click", () => window.symbiot.openExternal(KEYURL[$("provider").value]));
  $("save").addEventListener("click", async () => {
    const p = $("provider").value;
    $("saveMsg").textContent = "checking…"; $("saveMsg").className = "note muted";
    const cfg = { provider: p, model: $("model").value.trim() || undefined };
    if(p === "ollama") cfg.baseUrl = $("baseUrl").value.trim();
    else cfg.key = $("key").value.trim();
    const r = await window.symbiot.saveConnection(cfg);
    $("saveMsg").textContent = r.message || (r.ok ? "Connected." : "Couldn't connect.");
    $("saveMsg").className = "note " + (r.ok ? "ok" : "err");
    if(r.ok){ $("key").value=""; refreshStatus(); }
  });

  window.symbiot.onOpenTab((tab) => setTab(tab));
  window.symbiot.onResult((data) => { if(data.cmd===current){ $("out").textContent=data.text; $("out").classList.remove("muted"); $("copy").classList.remove("hidden"); } });

  syncProvider(); refreshStatus();
</script>
</body>
</html>
